{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subida Masiva - KuroReader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0f0f11; color: #f1f1f1; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #16161a; border: 1px solid #222; padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fff; font-size: 20px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        .upload-box { border: 2px dashed #2a2a30; padding: 30px; text-align: center; border-radius: 8px; background: #0f0f11; margin-bottom: 20px; transition: border-color 0.2s; }
        .upload-box:hover { border-color: #ff4757; }
        
        input[type="file"] { color: #aaa; font-size: 14px; }
        
        .btn-submit { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; width: 100%; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn-submit:hover { background: #ff6b81; }
        
        .back-link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📂 Subida Masiva de Páginas</h2>
        <p>Capítulo: <strong>{{ capitulo.numero_capitulo }}</strong> — {{ capitulo.manga.titulo }}</p>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="upload-box">
                <p style="margin-bottom: 10px;">Selecciona o arrastra todas las imágenes del capítulo juntas:</p>
                <!-- El atributo multiple permite seleccionar varios archivos de golpe -->
                <input type="file" name="imagenes" multiple accept="image/*" required>
            </div>
            
            <button type="submit" class="btn-submit">Subir y Ordenar Páginas 🚀</button>
        </form>

        <a href="{% url 'detalle_manga' capitulo.manga.id %}" class="back-link">← Volver al Manga</a>
    </div>

</body>
</html>
